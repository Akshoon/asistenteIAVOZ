<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgBase" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#11141c"/>
      <stop offset="70%" stop-color="#090a0d"/>
      <stop offset="100%" stop-color="#040507"/>
    </radialGradient>
    <linearGradient id="markGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="markGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="20" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="124" fill="url(#bgBase)"/>
  <rect width="504" height="504" x="4" y="4" rx="120" fill="none" stroke="rgba(255,255,255,0.07)" stroke-width="2"/>

  <!-- Orbital Ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="rgba(56, 189, 248, 0.12)" stroke-width="2" stroke-dasharray="6 8"/>

  <!-- Minimalist Monolithic A-Aperture Emblem -->
  <path d="M256 60L425 410H332L256 226L180 410H87L256 60Z" 
        fill="url(#markGrad)" 
        filter="url(#markGlow)"/>

  <!-- Aperture Celestial Core -->
  <circle cx="256" cy="310" r="38" fill="#090a0d"/>
  <circle cx="256" cy="310" r="22" fill="#38bdf8"/>
  <circle cx="256" cy="310" r="10" fill="#ffffff"/>
</svg>
