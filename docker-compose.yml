version: '3.8'

services:
  app:
    build: .
    container_name: aura-app
    restart: always
    env_file:
      - .env
    ports:
      - "3000:3000"
    volumes:
      - uploads_data:/app/server/uploads

  # Proxy inverso Caddy: Obtiene y renueva certificados SSL automáticamente para tu IP.nip.io
  caddy:
    image: caddy:alpine
    container_name: aura-caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  uploads_data:
  caddy_data:
  caddy_config:
