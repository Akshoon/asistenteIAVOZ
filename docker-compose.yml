version: '3.8'

services:
  app:
    build: .
    container_name: aura-voice-app
    restart: always
    env_file:
      - .env
    ports:
      # Expone en localhost en el puerto 8088 (junto a OpenGym en 8080 y GeoIgnis en 8085)
      - "127.0.0.1:${AURA_PORT:-8088}:3000"
    volumes:
      - uploads_data:/app/server/uploads

volumes:
  uploads_data:
