version: '3.8'

services:
  app:
    build: .
    container_name: aura-voice-app
    restart: always
    env_file:
      - .env
    ports:
      # Expone el puerto en localhost para que tu Nginx/Caddy principal lo redirija bajo aura.<IP>.nip.io
      - "127.0.0.1:${AURA_PORT:-3000}:3000"
    volumes:
      - uploads_data:/app/server/uploads

volumes:
  uploads_data:
